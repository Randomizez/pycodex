[build-system]
requires = ["hatchling>=1.17.1,<1.18"]
build-backend = "hatchling.build"

[project]
name = "python-codex"
version = "0.6.0"
description = "A minimal Python extraction of Codex's main agent loop"
readme = "README.md"
requires-python = ">=3.6.2"
dependencies = [
    "dataclasses>=0.8; python_version < '3.7'",
    "importlib_metadata>=4.8.3; python_version < '3.8'",
    "loguru>=0.7.3",
    "prompt-toolkit>=3.0.36",
    "pyyaml>=6.0",
    "requests>=2.27.1",
    "starlette>=0.19.1,<0.20; python_version < '3.7'",
    "starlette>=0.19.1; python_version >= '3.7'",
    "tomli>=1.2.3,<2; python_version < '3.11'",
    "typing_extensions>=4.1.1; python_version < '3.8'",
    "uvicorn>=0.16.0,<0.17; python_version < '3.7'",
    "uvicorn>=0.16.0; python_version >= '3.7'",
]

[project.scripts]
pycodex = "pycodex.cli:main"

[dependency-groups]
test = [
    "httpx>=0.22.0,<0.23; python_version < '3.8'",
    "httpx>=0.28; python_version >= '3.8'",
    "pillow>=8.4.0,<9; python_version < '3.7'",
    "pillow>=9.0.0; python_version >= '3.7'",
    "pycryptodomex>=3.20",
    "pytest>=6.2.5,<7; python_version < '3.8'",
    "pytest>=8.0; python_version >= '3.8'",
    "pytest-asyncio>=0.16,<0.17; python_version < '3.8'",
    "pytest-asyncio>=0.23; python_version >= '3.8'",
]
dev = [
    { include-group = "test" },
    "pycodex-ws==0.6.0",
    "black>=22.8.0",
    "debugpy>=1.8.20; python_version >= '3.8'",
    "isort>=5.10.1",
]

[tool.uv]
package = true
default-groups = []

[tool.uv.workspace]
members = ["packages/pycodex-ws"]

[tool.uv.sources]
pycodex-ws = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["pycodex", "responses_server"]

[tool.hatch.build.targets.sdist]
only-include = ["pycodex", "responses_server", "pyproject.toml", "README.md", "README_ZH.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pycodex-ws/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
