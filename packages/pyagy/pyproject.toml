[build-system]
requires = ["hatchling>=1.17.1,<1.18"]
build-backend = "hatchling.build"

[project]
name = "pyagy"
version = "0.7.4"
description = "Antigravity CLI (agy 1.5.14) wire-compatible harness built on python-codex"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "python-codex==0.7.4",
]

[project.scripts]
pyagy = "pyagy.cli:main"

[tool.uv.sources]
python-codex = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["pyagy"]

[tool.hatch.build.targets.sdist]
only-include = ["pyagy", "pyproject.toml", "README.md", "ALIGNMENT.md", "LICENSE"]
