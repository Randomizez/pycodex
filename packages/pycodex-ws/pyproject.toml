[build-system]
requires = ["hatchling>=1.17.1,<1.18"]
build-backend = "hatchling.build"

[project]
name = "pycodex-ws"
version = "0.6.0"
description = "Browser workspace and optional Feishu integration for python-codex"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "python-codex==0.6.0",
    "pillow>=9.0.0",
    "websockets>=11,<16",
]

[project.scripts]
pycodex-ws = "workspace_server:main"
pycodex-router = "pycodex_router.server:main"

[tool.uv.sources]
python-codex = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["workspace_server", "pycodex_ws", "pycodex_router"]
exclude = ["workspace_server/frontend"]
artifacts = [
    "workspace_server/workspace.html",
    "workspace_server/workspaces.html",
    "workspace_server/content_views.mjs",
    "workspace_server/content_views.css",
    "workspace_server/content_views.LICENSE.txt",
    "workspace_server/editor.mjs",
    "workspace_server/editor.css",
    "pycodex_router/index.html",
]

[tool.hatch.build.targets.sdist]
only-include = ["workspace_server", "pycodex_ws", "pycodex_router", "pyproject.toml", "README.md", "LICENSE"]
exclude = ["workspace_server/frontend/node_modules"]
