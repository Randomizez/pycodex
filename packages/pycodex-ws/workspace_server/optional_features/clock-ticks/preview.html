<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock tick dividers · Preview</title>
  <style>
    :root{color-scheme:light;--ink:#172630;--muted:#60727d;--line:#cbd8df;--panel:#f8fbfd;--accent:#087f9a}
    *{box-sizing:border-box}body{margin:0;background:#eef3f6;color:var(--ink);font:14px/1.6 system-ui,sans-serif}
    main{max-width:800px;margin:40px auto;padding:0 24px}h1{font-size:26px;font-weight:600;letter-spacing:-.5px;margin:0 0 8px}
    header p{color:var(--muted);font-size:13px;margin:0 0 22px}.frame{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);font-size:12px}
    .toolbar span{color:var(--muted)}.log{display:flex;flex-direction:column;gap:20px;min-height:340px;padding:28px 24px}
    .entry{min-width:0;flex:0 0 auto;line-height:1.6}.entry.user{align-self:flex-end;max-width:92%;padding:7px 12px;border-radius:10px 10px 3px 10px;background:#edf9f2}
    .entry>.text{white-space:pre-wrap;overflow-wrap:anywhere}.entry.response::before{content:"Codex";display:block;font-size:12px;font-weight:600;margin-bottom:7px}
    .composer{margin:0 24px 22px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px}
    .controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{font:inherit;font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);cursor:pointer}
    button:hover{background:var(--panel)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    footer,output{display:block;font-size:12px;color:var(--muted)}output{white-space:pre-wrap;padding:12px 0}
    @media(max-width:500px){main{padding:0 14px;margin:24px auto}.log{padding:24px 18px;gap:18px}.toolbar{padding:12px 18px}.composer{margin:0 18px 18px}}
  </style>
  <link rel="stylesheet" href="source/custom.css">
</head>
<body>
<main>
  <header><h1>Clock tick dividers</h1><p>一次轻量的时间标记。点击分隔线，查看完整触发时间和等待间隔。</p></header>
  <section class="frame">
    <div class="toolbar"><strong id="session-title">示例任务 A</strong><span>合成数据 · 交互预览</span></div>
    <div class="log" id="log" aria-label="示例对话"></div>
    <div class="composer">继续对话…</div>
  </section>
  <nav class="controls" aria-label="预览操作">
    <button id="new-tick" type="button">模拟 tick</button>
    <button id="update-reply" type="button">更新回复</button>
    <button id="switch-session" type="button">切换会话</button>
    <button id="reload-history" type="button">重载历史</button>
  </nav>
  <footer>静态示例，不连接服务或运行定时任务。紧凑时间使用浏览器时区，详情保留原始时区。</footer>
  <output id="verification" aria-live="polite"></output>
</main>
<script type="module" src="source/fixture.mjs"></script>
</body>
</html>
