name: publish

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Publish target repository
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
  release:
    types: [published]
  push:
    tags:
      - "v*"

jobs:
  pytest-core:
    name: core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.7"
          - "3.8"
          - "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group test

      - name: Check core test environment
        run: |
          uv run --group test python - <<'PY'
          from importlib.util import find_spec
          for name in ("workspace_server", "pycodex_ws", "lark_oapi", "IPython"):
              assert find_spec(name) is None, name
          PY

      - name: Run core tests
        run: uv run --group test pytest tests

  pytest-core-py36:
    name: core (Python 3.6)
    runs-on: ubuntu-22.04
    container:
      image: python:3.6.15-slim-bullseye
    steps:
      - name: Install system dependencies
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] https://archive.debian.org/debian bullseye main' \
            > /etc/apt/sources.list
          apt-get -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends git nodejs npm

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$PWD"

      - name: Show runtime versions
        run: |
          python --version
          pip --version
          git --version
          node --version

      - name: Install Python 3.6 compatibility dependencies
        run: |
          python -m pip install -i https://pypi.org/simple \
            "dataclasses>=0.8" \
            "typing_extensions>=4.1.1,<4.2" \
            "importlib_metadata>=4.8.3,<5" \
            "tomli>=1.2.3,<2" \
            "requests>=2.27.1" \
            "prompt-toolkit>=3.0.36,<3.1" \
            "pyyaml>=6.0" \
            "loguru>=0.7.3,<1" \
            "pycryptodomex>=3.20" \
            "pillow>=8.4.0,<9" \
            "starlette>=0.19.1,<0.20" \
            "uvicorn>=0.16,<0.17" \
            "pytest>=6.2.5,<7" \
            "pytest-asyncio>=0.16,<0.17"

      - name: Check core test environment
        run: |
          python - <<'PY'
          from importlib.util import find_spec
          for name in ("workspace_server", "pycodex_ws", "lark_oapi", "IPython"):
              assert find_spec(name) is None, name
          PY

      - name: Run Python 3.6 core tests
        run: PYTHONPATH="$PWD" python -m pytest -c /dev/null tests

  pytest-workspace:
    name: workspace (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.7"
          - "3.8"
          - "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run workspace and integration tests
        run: uv run --dev pytest packages/pycodex-ws/tests

  build:
    needs:
      - pytest-core
      - pytest-core-py36
      - pytest-workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist/python-codex .
          python -m build --outdir dist/pycodex-ws packages/pycodex-ws
          python -m twine check dist/python-codex/* dist/pycodex-ws/*

      - name: Smoke test installed wheels
        run: |
          python -m venv "$RUNNER_TEMP/pycodex-wheel"
          "$RUNNER_TEMP/pycodex-wheel/bin/python" -m pip install \
            dist/python-codex/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pycodex-wheel/bin/pycodex" --help
          "$RUNNER_TEMP/pycodex-wheel/bin/python" \
            "$GITHUB_WORKSPACE/tests/smoke_core_wheel.py"
          "$RUNNER_TEMP/pycodex-wheel/bin/python" -m pip install \
            "$GITHUB_WORKSPACE"/dist/pycodex-ws/*.whl
          "$RUNNER_TEMP/pycodex-wheel/bin/pycodex-ws" --help
          "$RUNNER_TEMP/pycodex-wheel/bin/python" -m workspace_server --help
          "$RUNNER_TEMP/pycodex-wheel/bin/python" -m pycodex_ws.feishu_oauth --help
          "$RUNNER_TEMP/pycodex-wheel/bin/python" - <<'PY'
          from importlib.util import find_spec
          from pycodex_ws import register_feishu_commands
          assert callable(register_feishu_commands)
          assert find_spec("lark_oapi") is None
          PY
          "$RUNNER_TEMP/pycodex-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/pycodex-wheel/bin/python" -m pip uninstall -y pycodex-ws
          "$RUNNER_TEMP/pycodex-wheel/bin/pycodex" --help
          "$RUNNER_TEMP/pycodex-wheel/bin/python" - <<'PY'
          from importlib.util import find_spec
          assert find_spec("workspace_server") is None
          assert find_spec("pycodex_ws") is None
          import pycodex.portable
          PY

      - name: Rebuild core from source distribution
        run: |
          python -m pip wheel --no-deps dist/python-codex/*.tar.gz \
            --wheel-dir "$RUNNER_TEMP/pycodex-sdist-wheel"
          "$RUNNER_TEMP/pycodex-wheel/bin/python" -m pip install \
            --no-deps --force-reinstall "$RUNNER_TEMP"/pycodex-sdist-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pycodex-wheel/bin/python" - <<'PY'
          from pycodex.portable.client import _decrypt_bundle, _encrypt_bundle
          payload = b"source distribution fixture"
          assert _decrypt_bundle(_encrypt_bundle(payload, "public fixture"), "public fixture") == payload
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/python-codex/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python-codex/
          repository-url: https://test.pypi.org/legacy/

  publish-pycodex-ws-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    needs:
      - build
      - publish-testpypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pycodex-ws/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish pycodex-ws to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pycodex-ws/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/python-codex/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python-codex/

  publish-pycodex-ws:
    if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    needs:
      - build
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/pycodex-ws/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish pycodex-ws to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pycodex-ws/
