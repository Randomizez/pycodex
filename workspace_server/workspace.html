<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__WORKSPACE_TITLE__</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f6;
      --panel: #f8fbfd;
      --panel-deep: #f2f6f8;
      --panel-raised: #ffffff;
      --panel-hover: #e8f1f5;
      --board-chrome: #ffffff;
      --ink: #172630;
      --muted: #60727d;
      --line: #cbd8df;
      --line-strong: #aebfc9;
      --accent: #087f9a;
      --accent-ink: #ffffff;
      --accent-soft: #e6f6f8;
      --warn: #b77908;
      --warn-ink: #62480c;
      --warn-soft: #fff7df;
      --info: #2868b2;
      --info-soft: #edf5ff;
      --success: #247a52;
      --success-line: #8bc9a8;
      --success-soft: #edf9f2;
      --danger: #b33d50;
      --danger-soft: #fff0f2;
      --violet: #6850a4;
      --violet-soft: #f4f0ff;
      --code: #f1f5f7;
      --entry-shadow: 0 1px 2px rgba(27, 57, 72, 0.06);
      --space-1: 2px;
      --space-2: 4px;
      --space-3: 6px;
      --space-4: 8px;
      --space-5: 10px;
      --space-6: 12px;
      --space-7: 14px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --chat-width: min(42vw, 760px);
      --splitter-width: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, textarea { font: inherit; }
    .pane-toggle { display: none; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--splitter-width) var(--chat-width);
      height: 100dvh;
      min-width: 0;
    }
    .workspace.collapsed .splitter::after {
      background: var(--accent);
    }
    .board-pane {
      min-width: 0;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--board-chrome);
    }
    .boardbar {
      min-width: 0;
      border-bottom: 1px solid var(--line);
      height: 44px;
      padding: 0 12px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
    }
    .boardbar-paths {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
      overflow: hidden;
      line-height: 1.4;
    }
    .boardbar-title {
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
    }
    .boardbar-paths code { border: 0; padding: 0; background: none; font-size: 11px; }
    .board-location { margin-left: auto; font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
    .boardbar-paths span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .workspace-back {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink);
      padding: 0;
      text-decoration: none;
    }
    .workspace-back:hover {
      background: var(--accent-soft);
    }
    .workspace-back:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .workspace-back svg {
      display: block;
      width: 18px;
      height: 18px;
    }
    .board {
      border: 0;
      min-width: 0;
      width: 100%;
      height: 100%;
      background: var(--board-chrome);
    }
    .splitter {
      position: relative;
      width: 8px;
      height: 100dvh;
      border: 0;
      border-right: 1px solid var(--line);
      background: var(--board-chrome);
      cursor: col-resize;
      padding: 0;
      touch-action: none;
    }
    .splitter::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 28px;
      border-radius: 999px;
      background: var(--line-strong);
      transform: translate(-50%, -50%);
    }
    .splitter:hover,
    .workspace.resizing .splitter {
      background: #dce9ee;
      border-color: var(--line-strong);
    }
    .splitter:hover::after,
    .workspace.resizing .splitter::after {
      background: var(--accent);
    }
    .workspace.resizing,
    .workspace.resizing * {
      cursor: col-resize;
      user-select: none;
    }
    .chat {
      position: relative;
      min-width: 0;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--panel-raised);
    }
    .topbar {
      min-width: 0;
      height: 44px;
      padding: 6px 20px;
      border-bottom: 1px solid var(--line);
      display: grid;
      align-content: center;
    }
    .tabbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .context-control {
      position: relative;
      display: flex;
      flex: 0 0 auto;
    }
    .context-meter {
      --context-remaining: 0%;
      --context-meter-size: 24px;
      position: relative;
      display: inline-grid;
      place-items: center;
      width: var(--context-meter-size);
      height: var(--context-meter-size);
      border: 0;
      padding: 0;
      border-radius: 999px;
      background: conic-gradient(var(--accent) 0 var(--context-remaining), var(--line) 0 100%);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      flex: 0 0 auto;
      cursor: pointer;
    }
    .context-meter:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .context-meter::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 999px;
      background: var(--panel-raised);
    }
    .context-meter-value {
      position: relative;
      z-index: 1;
    }
    .context-details {
      position: absolute;
      bottom: 100%;
      left: -6px;
      z-index: 5;
      width: 264px;
      max-width: calc(100vw - 48px);
      padding-bottom: 10px;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.5;
    }
    .context-details-card {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-raised);
      box-shadow: 0 6px 24px rgba(27, 57, 72, 0.12);
    }
    .context-details-heading {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
    }
    .context-details-heading span {
      color: var(--muted);
      font-weight: 400;
    }
    .context-details dl {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      margin: 8px 0;
    }
    .context-details dt { color: var(--muted); }
    .context-details dd {
      margin: 0;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .context-details p { margin: 0; color: var(--muted); }
    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 88px;
      max-width: 180px;
      height: 30px;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--panel-deep);
      color: var(--muted);
      padding: 0 8px 0 12px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .tab:hover {
      background: var(--panel-hover);
      color: var(--ink);
    }
    .tab-new:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .tab.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .tab-status {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      padding: 0;
      flex: 0 0 auto;
    }
    .tab-status::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--accent);
      animation: spinner-pulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .tab-status[hidden],
    .tab-label[hidden] {
      display: none;
    }
    .tab-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      text-align: left;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: inherit;
    }
    .tab-label:focus-visible {
      outline: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .tab-title-input {
      min-width: 0;
      width: 0;
      flex: 1;
      border: 0;
      padding: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      user-select: text;
    }
    .tab-close,
    .tab-new {
      width: 31px;
      height: 31px;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--panel-raised);
      color: var(--muted);
      padding: 0;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .tab-close {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 0;
      background: transparent;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .tab-close svg {
      display: block;
      width: 12px;
      height: 12px;
    }
    .tab-new {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      background: var(--panel-deep);
    }
    .tab-new svg {
      display: block;
      width: 18px;
      height: 18px;
    }
    .tab.active .tab-close {
      opacity: 0.85;
      visibility: visible;
      pointer-events: auto;
    }
    .tab.active .tab-close:disabled {
      opacity: 0.22;
      cursor: default;
    }
    .tab-close:hover,
    .tab-new:hover {
      color: var(--ink);
      background: var(--panel-hover);
    }
    .log {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--panel-raised);
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .entry {
      min-width: 0;
      flex: 0 0 auto;
      line-height: 1.6;
    }
    .entry-label {
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    .entry.user {
      align-self: flex-end;
      max-width: 92%;
      padding: 7px 12px;
      border-radius: 10px 10px 3px 10px;
      background: var(--success-soft);
    }
    .entry.response,
    .entry.assistant {
      padding: 0;
    }
    .entry.thinking,
    .entry.control,
    .entry.tool {
      border-left: 2px solid var(--line);
      padding: 2px 0 2px 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .entry.thinking {
      border-left-color: var(--accent);
      animation: activity-breathe 1.6s ease-in-out infinite;
    }
    .entry.control {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .entry.tool {
      font-size: 12px;
    }
    .entry.error {
      border-left: 2px solid var(--danger);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      background: var(--danger-soft);
      color: var(--danger);
    }
    .empty-chat {
      margin: auto 0;
      padding: 36px 0 56px;
      max-width: 360px;
    }
    .empty-chat .entry-label { color: var(--accent); }
    .empty-chat h1 { margin: 12px 0; font-size: 28px; line-height: 1.25; font-weight: 600; letter-spacing: -0.6px; }
    .empty-chat p { margin: 0; color: var(--muted); line-height: 1.75; }
    .text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .markdown {
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .markdown p {
      margin: 0 0 8px;
    }
    .markdown p:last-child,
    .markdown ul:last-child,
    .markdown ol:last-child,
    .markdown pre:last-child,
    .markdown table:last-child {
      margin-bottom: 0;
    }
    .markdown ul,
    .markdown ol {
      margin: 0 0 8px 18px;
      padding: 0;
    }
    .markdown li {
      margin: 2px 0;
    }
    .markdown pre {
      margin: 0 0 10px;
      padding: 10px 12px;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--code);
      overflow-x: auto;
      white-space: pre;
    }
    .markdown pre code {
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 12px;
    }
    .markdown table {
      width: 100%;
      margin: 0 0 var(--space-4);
      border-collapse: collapse;
      font-size: 13px;
    }
    .markdown th,
    .markdown td {
      border: 1px solid var(--line);
      padding: var(--space-3) var(--space-4);
      text-align: left;
      vertical-align: top;
    }
    .markdown th {
      background: var(--accent-soft);
      font-weight: 650;
    }
    .markdown a {
      color: var(--info);
      text-decoration: none;
    }
    .markdown a:hover {
      text-decoration: underline;
    }
    .markdown h1, .markdown h2, .markdown h3 { line-height: 1.4; margin: 16px 0 8px; font-weight: 600; }
    .markdown h1 { font-size: 20px; }
    .markdown h2 { font-size: 18px; }
    .markdown h3 { font-size: 16px; }
    .markdown > :first-child { margin-top: 0; }
    .markdown blockquote { margin: 16px 0; padding-left: 16px; border-left: 2px solid var(--line); color: var(--muted); }
    .markdown img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }
    .markdown .katex-display {
      margin: 0 0 var(--space-4);
      overflow-x: auto;
      overflow-y: hidden;
      overflow-wrap: normal;
      word-break: normal;
    }
    .markdown .katex {
      overflow-wrap: normal;
      word-break: normal;
    }
    .markdown .katex .text {
      white-space: normal;
      overflow-wrap: normal;
      word-break: normal;
    }
    .markdown .katex-display:last-child {
      margin-bottom: 0;
    }
    .composer {
      position: relative;
      min-width: 0;
      padding: 8px 20px 10px;
      display: grid;
      gap: 6px;
      align-content: end;
      background: var(--panel-raised);
    }
    .composer-surface {
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--panel-raised);
      box-shadow: 0 4px 16px rgba(27, 57, 72, 0.04);
      transition: border-color 120ms, box-shadow 120ms;
    }
    .composer-surface:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(8, 127, 154, 0.08);
    }
    .composer-box {
      min-width: 0;
      padding: 4px 10px 4px 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .queue-hint {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      max-width: 65%;
    }
    .queue-hint[hidden],
    .queue-indicator[hidden] {
      display: none;
    }
    .queue-indicator {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      max-width: 160px;
      height: 22px;
      padding: 0 7px;
      border: 0;
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--muted);
      background: var(--panel-deep);
    }
    .queue-symbol {
      flex-shrink: 0;
      font-size: 12px;
      line-height: 1;
    }
    .queue-symbol svg {
      display: block;
      width: 14px;
      height: 14px;
    }
    .queue-preview {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    textarea {
      min-width: 0;
      resize: none;
      max-height: 35vh;
      width: 100%;
      min-height: 28px;
      border: 0;
      padding: 3px 0;
      display: block;
      background: transparent;
      color: var(--ink);
      font: inherit;
      line-height: 22px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    textarea::-webkit-scrollbar {
      display: none;
    }
    textarea:focus {
      outline: 0;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .spinner-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      max-width: 100%;
      min-width: 0;
      padding: 4px 6px;
      border-bottom: 1px solid var(--line);
      border-radius: 9px 9px 0 0;
      background: var(--panel);
    }
    .prompt-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }
    .spinner {
      position: relative;
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      min-width: 0;
      height: 22px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: var(--space-1) var(--space-4) var(--space-1) 18px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid transparent;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .spinner:empty {
      display: none;
    }
    .spinner:hover {
      background: var(--panel-deep);
    }
    .spinner-wrap:not(:has(.spinner:not(:empty), .queue-hint:not([hidden]))) {
      display: none;
    }
    .spinner:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .spinner:not(:empty)::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 50%;
      width: 6px;
      height: 6px;
      margin-top: -3px;
      border-radius: 999px;
      background: var(--accent);
      animation: spinner-pulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .spinner.notify-enabled {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .toast {
      position: absolute;
      left: 0;
      bottom: 100%;
      z-index: 5;
      width: max-content;
      max-width: min(320px, calc(100vw - var(--space-6) * 2));
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--panel-raised);
      color: var(--ink);
      box-shadow: 0 8px 20px rgba(27, 57, 72, 0.14);
      padding: var(--space-4) var(--space-6);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 120ms ease, transform 120ms ease;
      margin-bottom: var(--space-3);
    }
    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }
    @keyframes spinner-pulse {
      0%, 100% {
        opacity: 0.45;
        transform: scale(0.82);
      }
      50% {
        opacity: 1;
        transform: scale(1.08);
      }
    }
    @keyframes activity-breathe {
      0%, 100% { border-left-color: var(--line); }
      50% { border-left-color: var(--accent); }
    }
    @media (prefers-reduced-motion: reduce) {
      .entry.thinking,
      .tab-status::before,
      .spinner:not(:empty)::before {
        animation: none;
      }
      .tab-status::before,
      .spinner:not(:empty)::before {
        opacity: 0.8;
        transform: none;
      }
    }
    code {
      background: var(--code);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 1px 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    @media (max-width: 760px) {
      .pane-toggle {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        margin-left: auto;
        padding: 0;
        flex: 0 0 auto;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .pane-toggle:hover { background: var(--panel-deep); color: var(--ink); }
      .pane-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .pane-toggle svg { width: 18px; height: 18px; }
      .workspace { height: 100dvh; display: block; }
      .board-pane, .chat { height: 100%; }
      .splitter { display: none; }
      .workspace[data-mobile-pane="chat"] .board-pane,
      .workspace[data-mobile-pane="board"] .chat { display: none; }
      .topbar { height: 44px; padding: 6px 16px; }
      .boardbar { padding: 0 16px; }
      .board-location { display: none; }
      .log { padding: 14px 16px; gap: 14px; }
      .composer { padding: 8px 16px max(10px, env(safe-area-inset-bottom)); }
      textarea { font-size: 16px; line-height: 24px; padding: 2px 0; }
      .tab-title-input { font-size: 16px; }
      .empty-chat h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="workspace" data-mobile-pane="chat">
    <section class="board-pane" aria-label="workspace board">

        <div class="boardbar-paths">
          <span class="boardbar-title">__WORKSPACE_TITLE__</span>

        <span class="board-location" title="__BOARD_LABEL__">Board</span>
        <button class="pane-toggle" type="button" data-pane="chat" title="Show chat" aria-label="Show chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>

    </section>
    <button id="splitter" class="splitter" type="button" aria-label="Resize chat panel"></button>
    <section class="chat" aria-label="pycodex chat">
      <div class="topbar">
        <div class="tabbar">
          <div id="tabs" class="tabs" role="tablist"></div>
          <button id="newTab" class="tab-new" type="button" title="New session" aria-label="New session">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <button class="pane-toggle" type="button" data-pane="board" title="Show board" aria-label="Show board">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <div id="log" class="log" aria-label="Conversation"></div>
      <form id="composer" class="composer">
        <div class="composer-surface">

            <div id="queueHint" class="queue-hint" role="status" aria-live="polite" hidden>
              <span id="steerHint" class="queue-indicator" hidden>

                <span class="queue-preview"></span>

                <span class="queue-symbol" role="img" aria-label="Queue">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 7v5l3 2"/>
                  </svg>
                </span>
                <span class="queue-preview"></span>

          </div>
          <div class="composer-box">
            <div id="contextControl" class="context-control">
              <button id="contextMeter" class="context-meter" type="button" aria-label="Context usage"
                      aria-expanded="false" aria-controls="contextDetails">
                <span id="contextMeterValue" class="context-meter-value">—</span>
              </button>
              <div id="contextDetails" class="context-details" role="region" aria-label="Context usage" hidden>
                <div class="context-details-card">
                  <div class="context-details-heading">Context usage <span>tokens</span></div>
                  <dl>
                    <dt>Current</dt><dd id="contextCurrent">—</dd>
                    <dt>Compact limit</dt><dd id="contextCompact">—</dd>
                    <dt>Max length</dt><dd id="contextMax">—</dd>
                  </dl>
                  <p id="contextNote"></p>

              </div>

            <textarea id="prompt" rows="1" aria-label="Message" title="Enter to send · Shift + Enter for a new line" placeholder="Message…"></textarea>

  </div>
  <template id="emptyChat">
    <div class="empty-chat">
      <div class="entry-label">pycodex</div>
      <h1>What are we working on?</h1>
      <p>Explore an idea, work through a problem, or build something together. Your conversation starts here.</p>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
  <script>
    const log = document.getElementById("log");
    const spinner = document.getElementById("spinner");
    const queueHint = document.getElementById("queueHint");
    const steerHint = document.getElementById("steerHint");
    const enqueueHint = document.getElementById("enqueueHint");
    const toast = document.getElementById("toast");
    const prompt = document.getElementById("prompt");
    const form = document.getElementById("composer");
    const boardFrame = document.getElementById("boardFrame");
    const workspace = document.querySelector(".workspace");
    const splitter = document.getElementById("splitter");
    const tabsEl = document.getElementById("tabs");
    const contextMeter = document.getElementById("contextMeter");
    const contextMeterValue = document.getElementById("contextMeterValue");
    const newTabButton = document.getElementById("newTab");
    let pollTimer = null;
    let boardPollTimer = null;
    let sessionPoll = null;
    let boardPollInFlight = false;
    let lastBoardSignature = null;
    let lastRenderedSignature = "";
    let resizeStart = null;
    let spinnerText = "";
    let toastTimer = null;
    let activeSessionId = "";
    let sessions = [];
    let isComposing = false;
    const sessionState = new Map();
    let restoreScrollTop = null;
    let suppressScrollSave = false;
    const markdownRenderer = window.markdownit
      ? window.markdownit({html: false, linkify: true, breaks: false})
      : null;
    const mathDelimiters = [
      {left: "$$", right: "$$", display: true},
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false},
      {left: "$", right: "$", display: false},
    ];
    const mathTokenPrefix = "\uE000math";
    const mathTokenSuffix = "\uE001";

    function relativeUrl(path) {
      return new URL(path, window.location.href).toString();
    }

    function addEntry(_role, text, cls, shouldStick = null) {
      const stickToBottom = shouldStick === null ? isNearBottom() : shouldStick;
      const entry = document.createElement("div");
      entry.className = "entry " + (cls || _role);
      const body = document.createElement("div");
      body.className = "text";
      body.textContent = text || "";
      entry.appendChild(body);
      log.appendChild(entry);
      if (stickToBottom) scrollToBottom();
      return body;
    }

    function addMarkdownEntry(role, text, cls, shouldStick = null) {
      const stickToBottom = shouldStick === null ? isNearBottom() : shouldStick;
      const entry = document.createElement("div");
      entry.className = "entry " + (cls || role);
      const body = document.createElement("div");
      body.className = "text markdown";
      renderMarkdownInto(body, text || "");
      entry.appendChild(body);
      log.appendChild(entry);
      if (stickToBottom) scrollToBottom();
      return body;
    }

    function renderMarkdownInto(root, source) {
      if (!markdownRenderer || !window.DOMPurify) {
        root.textContent = source || "";
        return;
      }
      const protectedMath = protectMath(String(source || ""));
      const dirtyHtml = markdownRenderer.render(protectedMath.source);
      root.innerHTML = window.DOMPurify.sanitize(dirtyHtml, {
        USE_PROFILES: {html: true},
        ADD_ATTR: ["target", "rel"],
      });
      renderProtectedMath(root, protectedMath.expressions);
      root.querySelectorAll("a").forEach((anchor) => {
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
      });
    }

    function isEscapedAt(source, index) {
      let slashCount = 0;
      for (let cursor = index - 1; cursor >= 0 && source[cursor] === "\\"; cursor -= 1) {
        slashCount += 1;
      }
      return slashCount % 2 === 1;
    }

    function countBackticks(source, index) {
      let count = 0;
      while (source[index + count] === "`") {
        count += 1;
      }
      return count;
    }

    function findMathEnd(source, start, delimiter) {
      let searchFrom = start + delimiter.left.length;
      while (searchFrom < source.length) {
        const end = source.indexOf(delimiter.right, searchFrom);
        if (end < 0) {
          return -1;
        }
        if (!isEscapedAt(source, end)) {
          if (
            delimiter.left === "$" &&
            (source[end - 1] === "$" || source[end + 1] === "$")
          ) {
            searchFrom = end + delimiter.right.length;
            continue;
          }
          return end;
        }
        searchFrom = end + delimiter.right.length;
      }
      return -1;
    }

    function protectMath(source) {
      const expressions = [];
      let protectedSource = "";
      let index = 0;
      while (index < source.length) {
        if (source[index] === "`") {
          const tickCount = countBackticks(source, index);
          const fence = "`".repeat(tickCount);
          const close = source.indexOf(fence, index + tickCount);
          if (close >= 0) {
            const end = close + tickCount;
            protectedSource += source.slice(index, end);
            index = end;
            continue;
          }
        }

        let matched = null;
        if (!isEscapedAt(source, index)) {
          for (const delimiter of mathDelimiters) {
            if (
              source.indexOf(delimiter.left, index) !== index ||
              (delimiter.left === "$" && source[index + 1] === "$")
            ) {
              continue;
            }
            const end = findMathEnd(source, index, delimiter);
            if (end > index + delimiter.left.length) {
              matched = {
                delimiter: delimiter,
                start: index,
                end: end,
              };
              break;
            }
          }
        }

        if (matched) {
          const expressionIndex = expressions.length;
          expressions.push({
            body: source.slice(
              matched.start + matched.delimiter.left.length,
              matched.end,
            ),
            delimiter: matched.delimiter,
          });
          protectedSource += mathTokenPrefix + expressionIndex + mathTokenSuffix;
          index = matched.end + matched.delimiter.right.length;
          continue;
        }

        protectedSource += source[index];
        index += 1;
      }
      return {
        source: protectedSource,
        expressions: expressions,
      };
    }

    function renderProtectedMath(root, expressions) {
      if (!expressions.length) {
        return;
      }
      const expressionByToken = new Map();
      expressions.forEach((expression, index) => {
        expressionByToken.set(
          mathTokenPrefix + index + mathTokenSuffix,
          expression,
        );
      });
      const textWalker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      let textNode = textWalker.nextNode();
      while (textNode) {
        textNodes.push(textNode);
        textNode = textWalker.nextNode();
      }
      for (const textNode of textNodes) {
        let value = textNode.nodeValue || "";
        let cursor = 0;
        let tokenIndex = value.indexOf(mathTokenPrefix, cursor);
        if (tokenIndex < 0) {
          continue;
        }
        const fragment = document.createDocumentFragment();
        while (tokenIndex >= 0) {
          const tokenEnd = value.indexOf(mathTokenSuffix, tokenIndex);
          if (tokenEnd < 0) {
            break;
          }
          const token = value.slice(tokenIndex, tokenEnd + mathTokenSuffix.length);
          const expression = expressionByToken.get(token);
          if (!expression) {
            break;
          }
          if (tokenIndex > cursor) {
            fragment.appendChild(
              document.createTextNode(value.slice(cursor, tokenIndex)),
            );
          }
          const mathNode = document.createElement("span");
          const sourceText =
            expression.delimiter.left +
            expression.body +
            expression.delimiter.right;
          if (window.renderMathInElement) {
            mathNode.textContent = sourceText;
            window.renderMathInElement(mathNode, {
              delimiters: [
                {
                  left: expression.delimiter.left,
                  right: expression.delimiter.right,
                  display: expression.delimiter.display,
                },
              ],
              throwOnError: false,
              trust: false,
            });
          } else {
            mathNode.textContent = expression.body;
          }
          fragment.appendChild(mathNode);
          cursor = tokenEnd + mathTokenSuffix.length;
          tokenIndex = value.indexOf(mathTokenPrefix, cursor);
        }
        if (cursor > 0) {
          if (cursor < value.length) {
            fragment.appendChild(document.createTextNode(value.slice(cursor)));
          }
          if (textNode.parentNode) {
            textNode.parentNode.replaceChild(fragment, textNode);
          }
        }
      }
      restoreUnrenderedMathTokens(root, expressionByToken);
    }

    function restoreUnrenderedMathTokens(root, expressionByToken) {
      const textWalker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let textNode = textWalker.nextNode();
      while (textNode) {
        let value = textNode.nodeValue || "";
        expressionByToken.forEach((expression, token) => {
          const sourceText =
            expression.delimiter.left +
            expression.body +
            expression.delimiter.right;
          value = value.split(token).join(sourceText);
        });
        textNode.nodeValue = value;
        textNode = textWalker.nextNode();
      }
    }

    function loadChatWidth() {
      const stored = Number(window.localStorage.getItem("pycodex.workspace.chatWidth") || 0);
      if (stored > 0) setChatWidth(stored);
    }

    function centerSplit() {
      setChatWidth(Math.max(0, (window.innerWidth - 8) / 2));
    }

    function setChatWidth(width) {
      const viewportWidth = window.innerWidth || 0;
      const splitterWidth = 8;
      const gutterWidth = Math.min(24, Math.max(12, Math.round(viewportWidth * 0.06)));
      const availableWidth = Math.max(0, viewportWidth - splitterWidth);
      const maxChatWidth = Math.max(gutterWidth, availableWidth - gutterWidth);
      const collapseWidth = Math.min(
        280,
        Math.max(120, Math.round(viewportWidth * 0.25)),
      );
      let nextWidth = Math.max(gutterWidth, Math.min(maxChatWidth, Math.round(width)));
      let collapsed = false;
      if (nextWidth < collapseWidth) {
        nextWidth = gutterWidth;
        collapsed = true;
      } else if (availableWidth - nextWidth < collapseWidth) {
        nextWidth = maxChatWidth;
        collapsed = true;
      }
      workspace.style.setProperty("--chat-width", `${nextWidth}px`);
      workspace.classList.toggle("collapsed", collapsed);
      window.localStorage.setItem("pycodex.workspace.chatWidth", String(nextWidth));
    }

    function startResize(event) {
      if (!workspace) return;
      const chatWidth = document.querySelector(".chat").getBoundingClientRect().width;
      resizeStart = { pointerId: event.pointerId, startX: event.clientX, startWidth: chatWidth };
      splitter.setPointerCapture(event.pointerId);
      workspace.classList.add("resizing");
      event.preventDefault();
    }

    function updateResize(event) {
      if (!resizeStart) return;
      const delta = resizeStart.startX - event.clientX;
      setChatWidth(resizeStart.startWidth + delta);
      event.preventDefault();
    }

    function endResize(event) {
      if (!resizeStart) return;
      try {
        splitter.releasePointerCapture(resizeStart.pointerId);
      } catch (_error) {
        // Pointer capture can already be released by the browser.
      }
      resizeStart = null;
      workspace.classList.remove("resizing");
      event.preventDefault();
    }

    function setSpinner(text, options = {}) {
      const previousText = spinnerText;
      const nextText = String(text || "").trim();
      const wasRunning = Boolean(previousText);
      const isRunning = Boolean(nextText);
      spinnerText = nextText;
      spinner.textContent = spinnerText;
      if (wasRunning && !isRunning && !options.suppressDoneNotification) {
        const state = stateForSession(activeSessionId);
        if (state.wasRunning) notifySessionDone(activeSessionId);
      }
      updateSpinnerNotifyUi();
    }

    function showToast(text) {
      if (toastTimer) clearTimeout(toastTimer);
      toast.textContent = text;
      toast.classList.add("visible");
      toastTimer = setTimeout(() => {
        toastTimer = null;
        toast.classList.remove("visible");
      }, 1400);
    }

    function updateSpinnerNotifyUi() {
      const state = stateForSession(activeSessionId);
      const enabled = Boolean(spinnerText && state.notifyWhenDone);
      spinner.classList.toggle("notify-enabled", enabled);
      spinner.setAttribute("aria-checked", enabled ? "true" : "false");
      if (!spinnerText) {
        spinner.title = "Spinner is idle";
      } else if (enabled) {
        spinner.title = "Notify when done is on";
      } else {
        spinner.title = "Notify when done is off";
      }
    }

    function notificationAvailable() {
      return "Notification" in window;
    }

    function requestNotificationPermission() {
      try {
        const requestResult = Notification.requestPermission();
        if (requestResult && typeof requestResult.then === "function") {
          return requestResult;
        }
        return Promise.resolve(Notification.permission);
      } catch (_error) {
        return Promise.resolve(Notification.permission);
      }
    }

    function notifySessionDone(sessionId, sessionSummary = null) {
      if (!sessionId) return;
      const state = stateForSession(sessionId);
      if (!state.notifyWhenDone) return;
      state.notifyWhenDone = false;
      if (!notificationAvailable() || Notification.permission !== "granted") return;
      const session = sessionSummary || sessionById(sessionId);
      const title = (session && session.title) || "pycodex";
      const lastAssistant = (session && session.last_assistant) || "Done.";
      try {
        new Notification(`session: ${title}`, {
          body: lastAssistant,
          tag: `pycodex-workspace-done-${sessionId}`,
        });
      } catch (_error) {
        return;
      }
    }

    function sessionById(sessionId) {
      return sessions.find((session) => (session.id || "") === sessionId) || null;
    }

    function isSessionRunning(sessionId) {
      if (sessionId === activeSessionId && spinnerText) return true;
      const session = sessionById(sessionId);
      if (session) return Boolean(session.running);
      return false;
    }

    async function toggleSpinnerNotification() {
      const sessionId = activeSessionId;
      if (!sessionId || !isSessionRunning(sessionId)) {
        showToast("notify-on-done unavailable");
        return;
      }
      const state = stateForSession(sessionId);
      if (state.notifyWhenDone) {
        state.notifyWhenDone = false;
        showToast("notify-on-done canceled");
        updateSpinnerNotifyUi();
        return;
      }
      if (!notificationAvailable()) {
        showToast("browser notifications unavailable");
        return;
      }
      if (Notification.permission === "denied") {
        showToast("browser notifications blocked");
        return;
      }
      state.notifyWhenDone = true;
      showToast("notify-on-done enabled");
      updateSpinnerNotifyUi();
      if (Notification.permission !== "granted") {
        const permission = await requestNotificationPermission();
        if (permission !== "granted") {
          state.notifyWhenDone = false;
          showToast("notify-on-done canceled");
          updateSpinnerNotifyUi();
          return;
        }
      }
      if (!isSessionRunning(sessionId)) {
        state.notifyWhenDone = false;
        showToast("notify-on-done canceled");
      }
      updateSpinnerNotifyUi();
    }

    function isNearBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    }

    function scrollToBottom() {
      log.scrollTop = log.scrollHeight;
    }

    function resizePrompt() {
      prompt.style.height = "auto";
      const borderHeight = prompt.offsetHeight - prompt.clientHeight;
      const maxHeight = Math.round(window.innerHeight * 0.35);
      const nextHeight = Math.min(prompt.scrollHeight + borderHeight, maxHeight);
      prompt.style.height = `${nextHeight}px`;
    }

    function stateForSession(sessionId) {
      const key = String(sessionId || "");
      if (!sessionState.has(key)) {
        sessionState.set(key, {
          lastRenderedSignature: "",
          scrollTop: null,
          draft: "",
          notifyWhenDone: false,
          wasRunning: false,
          inputRequest: null,
        });
      }
      return sessionState.get(key);
    }

    function saveActiveSessionUiState() {
      if (!activeSessionId) return;
      const state = stateForSession(activeSessionId);
      if (log.scrollHeight > log.clientHeight) {
        state.scrollTop = log.scrollTop;
      }
      state.draft = prompt.value;
      state.lastRenderedSignature = lastRenderedSignature;
    }

    function updateSessions(nextSessions) {
      const incomingSessions = Array.isArray(nextSessions) ? nextSessions : sessions;
      incomingSessions.forEach((session) => {
        const sessionId = session.id || "";
        if (!sessionId) return;
        const state = stateForSession(sessionId);
        const wasRunning = Boolean(state.wasRunning);
        const isRunning = Boolean(session.running);
        if (!wasRunning && isRunning) {
          state.notifyWhenDone = false;
        } else if (wasRunning && !isRunning) {
          notifySessionDone(sessionId, session);
        }
        state.wasRunning = isRunning;
      });
      sessions = incomingSessions;
      if (!activeSessionId && sessions.length) {
        activeSessionId = sessions[0].id || "";
      }
      renderTabs();
      updatePromptPlaceholder();
      updateContextMeter();
      updateSpinnerNotifyUi();
    }

    function renderTabs() {
      const existingTabs = new Map(
        Array.from(tabsEl.children, tab => [tab.dataset.sessionId, tab])
      );
      sessions.forEach((session, index) => {
        const sessionId = session.id || "";
        let tab = existingTabs.get(sessionId);
        if (!tab) {
          tab = document.createElement("div");
          tab.dataset.sessionId = sessionId;
          tab.setAttribute("role", "tab");
          tab.addEventListener("click", () => switchSession(sessionId));

          const status = document.createElement("span");
          status.className = "tab-status";
          status.setAttribute("aria-hidden", "true");
          tab.appendChild(status);

          const label = document.createElement("button");
          label.type = "button";
          label.className = "tab-label";
          label.addEventListener("click", event => {
            if (sessionId !== activeSessionId) return;
            event.stopPropagation();
            editSessionTitle(tab, sessionId);
          });
          tab.appendChild(label);

          const close = document.createElement("button");
          close.type = "button";
          close.className = "tab-close";
          close.title = "Close session";
          close.setAttribute("aria-label", "Close session");
          close.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
            'stroke-width="1.5" stroke-linecap="round" aria-hidden="true">' +
            '<path d="M4 4l8 8M12 4l-8 8"/></svg>';
          close.addEventListener("click", event => {
            event.stopPropagation();
            closeSession(sessionId);
          });
          tab.appendChild(close);
        }
        existingTabs.delete(sessionId);
        tab.className =
          "tab" +
          (sessionId === activeSessionId ? " active" : "") +
          (session.running ? " running" : "");
        tab.title = session.title || `Session ${index + 1}`;
        tab.setAttribute("aria-selected", sessionId === activeSessionId ? "true" : "false");
        tab.setAttribute("aria-busy", String(Boolean(session.running)));
        tab.querySelector(".tab-status").hidden = !session.running;
        const label = tab.querySelector(".tab-label");
        label.textContent = session.title || `Session ${index + 1}`;
        label.title = sessionId === activeSessionId ? "Click to rename session" : tab.title;
        tab.querySelector(".tab-close").disabled = sessions.length <= 1;
        if (tabsEl.children[index] !== tab) {
          tabsEl.insertBefore(tab, tabsEl.children[index] || null);
        }
      });
      existingTabs.forEach(tab => tab.remove());
    }

    function editSessionTitle(tab, sessionId) {
      const session = sessionById(sessionId);
      const label = tab.querySelector(".tab-label");
      const input = document.createElement("input");
      input.type = "text";
      input.className = "tab-title-input";
      input.setAttribute("aria-label", "Session title");
      input.value = session.title || "";
      input.placeholder = label.textContent;
      tab.style.width = `${tab.getBoundingClientRect().width}px`;
      label.hidden = true;
      tab.insertBefore(input, label);
      let finished = false;
      const finish = save => {
        if (finished) return;
        finished = true;
        const title = input.value.trim();
        input.remove();
        label.hidden = false;
        tab.style.width = "";
        if (save && title && title !== session.title) {
          renameSession(sessionId, title);
        }
      };
      input.addEventListener("click", event => event.stopPropagation());
      input.addEventListener("keydown", event => {
        if (event.isComposing) return;
        if (event.key === "Enter" || event.key === "Escape") {
          event.preventDefault();
          finish(event.key === "Enter");
          label.focus();
        }
      });
      input.addEventListener("blur", () => finish(true));
      input.focus();
      input.select();
    }

    async function renameSession(sessionId, title) {
      try {
        const response = await fetch(relativeUrl("api/session/message"), {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({prompt: `/title ${title}`, sender: "web", session_id: sessionId}),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }
        const session = sessionById(sessionId);
        if (session) {
          session.title = payload.snapshot.title;
          renderTabs();
        }
      } catch (error) {
        addEntry("error", `Could not rename session: ${error.message}`, "error");
      }
    }

    function updatePromptPlaceholder(snapshot = null) {
      const session = snapshot || sessionById(activeSessionId);
      const label = session && session.model ? `Message to ${session.model}` : "Message";
      prompt.placeholder = `${label}…`;
      prompt.setAttribute("aria-label", label);
    }

    function updateContextMeter(snapshot = null) {
      const session = snapshot || sessionById(activeSessionId);
      if (!session) return;
      const percent = session.context_remaining_percent;
      const compact = session.auto_compact_token_limit;
      const formatTokens = value => value == null ? "—" : value.toLocaleString("en-US");
      const remainingLabel = compact == null ? "context remaining" : "remaining until compact";
      contextMeter.style.setProperty("--context-remaining", `${percent == null ? 0 : percent}%`);
      contextMeterValue.textContent = percent == null ? "—" : percent >= 100 ? "" : String(percent);
      contextMeter.setAttribute("aria-label", percent == null
        ? "Context usage details"
        : `${percent}% ${remainingLabel}. Context usage details`);
      document.getElementById("contextCurrent").textContent = formatTokens(session.usage_tokens);
      document.getElementById("contextCompact").textContent = compact == null ? "Off" : formatTokens(compact);
      document.getElementById("contextMax").textContent = formatTokens(session.max_context_window);
      const note = compact == null
        ? "Auto-compact is off. The ring shows remaining context."
        : "The ring reaches 0% at the compact limit. Compaction runs before the next model request.";
      document.getElementById("contextNote").textContent = session.usage_tokens == null
        ? `Waiting for current usage. ${note}`
        : note;
    }

    function setupContextDetails() {
      const control = document.getElementById("contextControl");
      const details = document.getElementById("contextDetails");
      let pinned = false;
      const show = visible => {
        details.hidden = !visible;
        contextMeter.setAttribute("aria-expanded", String(visible));
      };
      const close = () => {
        pinned = false;
        show(false);
      };
      control.addEventListener("pointerenter", event => {
        if (event.pointerType !== "touch") show(true);
      });
      control.addEventListener("pointerleave", () => {
        if (!pinned) show(false);
      });
      contextMeter.addEventListener("focus", () => show(true));
      control.addEventListener("focusout", event => {
        if (!pinned && !control.contains(event.relatedTarget)) show(false);
      });
      contextMeter.addEventListener("click", () => {
        pinned = !pinned;
        show(pinned);
      });
      document.addEventListener("pointerdown", event => {
        if (!control.contains(event.target)) close();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") close();
      });
      tabsEl.addEventListener("click", close);
      newTabButton.addEventListener("click", close);
    }

    function messageSignature(snapshot) {
      const turns = (snapshot && snapshot.turns) || [];
      return JSON.stringify([
        turns.map((item) => [
          item.submission_id || "",
          item.turn_id || "",
          item.prompt || "",
          item.response || "",
          item.thinking || "",
          item.status || "",
          item.error || "",
          item.kind || "",
        ]),
        snapshot.input_request || null,
      ]);
    }

    async function pollSession() {
      const requestedSessionId = activeSessionId;
      if (sessionPoll) {
        if (sessionPoll.sessionId === requestedSessionId) return;
        sessionPoll.controller.abort();
      }
      const request = {sessionId: requestedSessionId, controller: new AbortController()};
      sessionPoll = request;
      try {
        const path = requestedSessionId
          ? `api/session?session_id=${encodeURIComponent(requestedSessionId)}`
          : "api/session";
        const response = await fetch(relativeUrl(path), {signal: request.controller.signal});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (sessionPoll !== request || requestedSessionId !== activeSessionId) {
          return;
        }
        if (payload.session_id && payload.session_id !== activeSessionId) {
          activeSessionId = payload.session_id;
        }
        updateSessions(payload.sessions || []);
        renderSnapshot(payload.snapshot);
      } catch (error) {
        if (sessionPoll === request && requestedSessionId === activeSessionId) {
          setSpinner(`poll error: ${error.message}`);
        }
      } finally {
        if (sessionPoll === request) sessionPoll = null;
      }
    }

    function startPolling() {
      if (pollTimer) return;
      pollSession();
      pollTimer = setInterval(pollSession, 2000);
    }

    function stopPolling() {
      if (!pollTimer) return;
      clearInterval(pollTimer);
      pollTimer = null;
    }

    async function pollBoard() {
      if (boardPollInFlight) return;
      boardPollInFlight = true;
      try {
        const response = await fetch(relativeUrl("api/board"));
        if (!response.ok) return;
        const payload = await response.json();
        if (!payload.exists) {
          lastBoardSignature = null;
          return;
        }
        const signature = `${payload.mtime_ns || ""}:${payload.size || ""}`;
        if (lastBoardSignature === null) {
          lastBoardSignature = signature;
          boardFrame.src = `board?t=${Date.now()}`;
          return;
        }
        if (signature !== lastBoardSignature) {
          lastBoardSignature = signature;
          boardFrame.src = `board?t=${Date.now()}`;
        }
      } catch (_error) {
        return;
      } finally {
        boardPollInFlight = false;
      }
    }

    function startBoardPolling() {
      if (boardPollTimer) return;
      pollBoard();
      boardPollTimer = setInterval(pollBoard, 2000);
    }

    function renderQueueHint(inputs) {
      queueHint.hidden = inputs.length === 0;
      for (const [kind, label, badge] of [
        ["steer", "[soon]", steerHint],
        ["enqueue", "[on done]", enqueueHint],
      ]) {
        const text = inputs.filter(item => item.queue === kind).map(item => item.prompt).join("\n");
        badge.hidden = !text;
        badge.querySelector(".queue-preview").textContent = text;
        badge.title = label + "\n" + text;
      }
    }

    function renderSnapshot(snapshot) {
      if (!snapshot) return;
      updatePromptPlaceholder(snapshot);
      const state = stateForSession(activeSessionId);
      state.inputRequest = snapshot.input_request || null;
      renderQueueHint(snapshot.queued_inputs);
      const signature = messageSignature(snapshot);
      if (signature === state.lastRenderedSignature) {
        setSpinner(snapshot.spinner || "");
        updateContextMeter(snapshot);
        return;
      }
      state.lastRenderedSignature = signature;
      lastRenderedSignature = signature;
      const shouldStick = isNearBottom();
      const previousScrollTop = log.scrollTop;
      suppressScrollSave = true;
      try {
        log.textContent = "";
        const turns = Array.isArray(snapshot.turns) ? snapshot.turns : [];
        if (turns.length) {
          turns.forEach((turn) => renderTurn(turn, shouldStick));
        } else if (!state.inputRequest) {
          log.appendChild(document.getElementById("emptyChat").content.cloneNode(true));
        }
        if (state.inputRequest) {
          addEntry("input requested", state.inputRequest.text, "control", shouldStick);
        }
        setSpinner(snapshot.spinner || "");
        updateContextMeter(snapshot);
        if (restoreScrollTop !== null) {
          log.scrollTop = Math.min(
            restoreScrollTop,
            Math.max(0, log.scrollHeight - log.clientHeight),
          );
          restoreScrollTop = null;
        } else if (shouldStick) {
          scrollToBottom();
        } else {
          log.scrollTop = Math.min(
            previousScrollTop,
            Math.max(0, log.scrollHeight - log.clientHeight),
          );
        }
      } finally {
        suppressScrollSave = false;
      }
      state.scrollTop = log.scrollTop;
    }

    function renderTurn(turn, shouldStick) {
      const isControl = turn.kind === "control";
      if (turn.prompt) {
        addEntry(
          isControl ? "command" : "prompt",
          turn.prompt || "",
          isControl ? "control" : "user",
          shouldStick,
        );
      }
      if (turn.response) {
        if (isControl) {
          addEntry("result", turn.response, "control", shouldStick);
        } else {
          addMarkdownEntry("response", turn.response, "response", shouldStick);
        }
      }
      if (turn.thinking) addEntry("thinking", turn.thinking || "", "thinking", shouldStick);
      if (turn.error) addEntry("error", turn.error || "", "error", shouldStick);
    }

    async function submitPrompt(text) {
      const response = await fetch(relativeUrl("api/session/message"), {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({prompt: text, sender: "web", session_id: activeSessionId}),
      });
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        addEntry("error", payload.error || `HTTP ${response.status}`, "error");
        setSpinner("");
        return;
      }
      if (payload.snapshot) {
        if (payload.sessions) updateSessions(payload.sessions);
        renderSnapshot(payload.snapshot);
      } else {
        setSpinner("");
      }
      startPolling();
    }

    async function switchSession(sessionId) {
      if (!sessionId || sessionId === activeSessionId) return;
      saveActiveSessionUiState();
      activeSessionId = sessionId;
      renderTabs();
      updatePromptPlaceholder();
      updateContextMeter();
      const state = stateForSession(sessionId);
      state.lastRenderedSignature = "";
      lastRenderedSignature = "";
      prompt.value = state.draft || "";
      resizePrompt();
      suppressScrollSave = true;
      log.textContent = "";
      renderQueueHint([]);
      suppressScrollSave = false;
      setSpinner("", {suppressDoneNotification: true});
      restoreScrollTop = state.scrollTop;
      await pollSession();
      renderTabs();
    }

    async function createSession() {
      saveActiveSessionUiState();
      const response = await fetch(relativeUrl("api/sessions"), {method: "POST"});
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        addEntry("error", payload.error || `HTTP ${response.status}`, "error");
        return;
      }
      activeSessionId = payload.session_id || "";
      const state = stateForSession(activeSessionId);
      state.draft = "";
      state.scrollTop = null;
      state.lastRenderedSignature = "";
      lastRenderedSignature = "";
      prompt.value = "";
      resizePrompt();
      restoreScrollTop = null;
      updateSessions(payload.sessions || []);
      renderSnapshot(payload.snapshot);
    }

    async function closeSession(sessionId) {
      if (!sessionId || sessions.length <= 1) return;
      const response = await fetch(relativeUrl(`api/sessions/${encodeURIComponent(sessionId)}`), {
        method: "DELETE",
      });
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        addEntry("error", payload.error || `HTTP ${response.status}`, "error");
        return;
      }
      updateSessions(payload.sessions || []);
      if (activeSessionId === sessionId) {
        await switchSession(sessions[0].id);
      }
      sessionState.delete(sessionId);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = prompt.value.trim();
      if (!text && !stateForSession(activeSessionId).inputRequest) return;
      prompt.value = "";
      resizePrompt();
      stateForSession(activeSessionId).draft = "";
      submitPrompt(text);
    });

    prompt.addEventListener("input", () => {
      stateForSession(activeSessionId).draft = prompt.value;
      resizePrompt();
    });

    prompt.addEventListener("compositionstart", () => {
      isComposing = true;
    });

    prompt.addEventListener("compositionend", () => {
      isComposing = false;
    });

    log.addEventListener("scroll", () => {
      if (suppressScrollSave) return;
      if (!activeSessionId) return;
      stateForSession(activeSessionId).scrollTop = log.scrollTop;
    });

    prompt.addEventListener("keydown", (event) => {
      if (event.isComposing || isComposing || event.keyCode === 229) return;
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    splitter.addEventListener("pointerdown", startResize);
    splitter.addEventListener("pointermove", updateResize);
    splitter.addEventListener("pointerup", endResize);
    splitter.addEventListener("pointercancel", endResize);
    splitter.addEventListener("dblclick", centerSplit);
    spinner.addEventListener("click", toggleSpinnerNotification);
    newTabButton.addEventListener("click", createSession);
    document.querySelectorAll("[data-pane]").forEach((button) => {
      button.addEventListener("click", () => {
        workspace.dataset.mobilePane = button.dataset.pane;
        if (button.dataset.pane === "chat") resizePrompt();
      });
    });
    window.addEventListener("resize", () => {
      const current = Number(window.localStorage.getItem("pycodex.workspace.chatWidth") || 0);
      if (current > 0) setChatWidth(current);
      resizePrompt();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      pollSession();
      pollBoard();
    });

    loadChatWidth();
    setupContextDetails();
    resizePrompt();
    startPolling();
    startBoardPolling();
  </script>
</body>
</html>
